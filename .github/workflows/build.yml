name: Build AntiCheat Test Suite

# Builds the two mod versions in sequence rather than in parallel:
# 1.21.11 first, since that build is the well-verified one and doubles as a
# smoke test that the workflow/toolchain itself is healthy. The 26.2 build
# only runs if that gate passes, since there's no point spending CI time on
# the experimental build if something more basic is already broken.
#
# Each project ships its own committed Gradle wrapper (gradlew +
# gradle/wrapper/gradle-wrapper.jar), pinned to the Gradle version that
# project actually needs: 8.10 for 1.21.11 (Loom 1.7), 9.5.1 for 26.2
# (Loom 1.17, per Fabric's porting notes). Gradle versions below 8.5
# cannot run on JDK 21 ("Unsupported class file major version 65"), which
# is why the pin matters -- don't let this drift back to an older default.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-1211:
    name: "Build & verify (1.21.11)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle downloads/build state between runs; the wrapper
      # (committed in this project) is what actually picks the Gradle
      # version, this just wires up caching around it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: anticheat-test-1.21.11

      - name: Grant execute permission for gradlew
        working-directory: anticheat-test-1.21.11
        run: chmod +x gradlew

      - name: Build
        working-directory: anticheat-test-1.21.11
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: anticheat-test-1.21.11
          path: anticheat-test-1.21.11/build/libs/*.jar
          if-no-files-found: error

  build-262:
    name: "Build (26.2, experimental)"
    needs: build-1211
    runs-on: ubuntu-latest
    # 26.2 was released after this mod's mappings were last verified by hand
    # (see README "A note on scope") -- don't fail the whole workflow red
    # over a mapping-name mismatch here, but the job status below still
    # shows amber/failed so it's not silently swallowed.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: anticheat-test-26.2

      - name: Grant execute permission for gradlew
        working-directory: anticheat-test-26.2
        run: chmod +x gradlew

      - name: Build
        working-directory: anticheat-test-26.2
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: anticheat-test-26.2
          path: anticheat-test-26.2/build/libs/*.jar
          if-no-files-found: error
