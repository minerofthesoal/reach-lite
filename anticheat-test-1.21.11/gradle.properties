# Minecraft / mapping / loader versions.
# These are the values Fabric published for 1.21.11 (last of the classic 1.x.y line).
# Double check current numbers at https://fabricmc.net/develop/ before building --
# Fabric bumps loader/API patch versions frequently and an old one can fail to resolve.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.18.1

# Fabric API - check https://modrinth.com/mod/fabric-api/versions?g=1.21.11 for the
# exact current build string, the suffix must match minecraft_version.
fabric_version=0.135.0+1.21.11

# Mod Properties
mod_version=1.0.0
maven_group=net.blazeindustries
archives_base_name=anticheat-test

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
