# 26.2 ships unobfuscated -- there is no Yarn for it, so this project uses
# Mojang's own official mappings directly via loom.officialMojangMappings().
# Versions below are what Fabric published as of their 26.2 porting post
# (docs.fabricmc.net/develop/porting, fabricmc.net/2026/06/15/262.html).
# 26.2 released after my training cutoff, so re-check
# https://fabricmc.net/develop/ before building -- these move fast.
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.153.0+26.2

# Mod Properties
mod_version=1.0.0
maven_group=net.blazeindustries
archives_base_name=anticheat-test

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
